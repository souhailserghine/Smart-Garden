<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f7fa;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e8f0f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dfe9f3;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:0.05" />
    </linearGradient>
    
    <linearGradient id="leafGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:0.03" />
    </linearGradient>
  </defs>
  
  <!-- Base gradient background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  
  <!-- Decorative plant leaves - top left -->
  <g opacity="0.15">
    <ellipse cx="100" cy="150" rx="80" ry="120" fill="#2ecc71" transform="rotate(-35 100 150)"/>
    <ellipse cx="150" cy="100" rx="60" ry="100" fill="#27ae60" transform="rotate(25 150 100)"/>
    <ellipse cx="80" cy="80" rx="50" ry="90" fill="#2ecc71" transform="rotate(-50 80 80)"/>
  </g>
  
  <!-- Decorative plant leaves - top right -->
  <g opacity="0.12">
    <ellipse cx="1820" cy="200" rx="100" ry="140" fill="#3498db" transform="rotate(45 1820 200)"/>
    <ellipse cx="1900" cy="150" rx="70" ry="110" fill="#2980b9" transform="rotate(-30 1900 150)"/>
    <ellipse cx="1750" cy="120" rx="60" ry="100" fill="#3498db" transform="rotate(60 1750 120)"/>
  </g>
  
  <!-- Bottom left decorative elements -->
  <g opacity="0.1">
    <circle cx="150" cy="950" r="200" fill="#2ecc71"/>
    <ellipse cx="250" cy="1000" rx="150" ry="100" fill="#27ae60"/>
    <ellipse cx="80" cy="1020" rx="90" ry="130" fill="#2ecc71" transform="rotate(-40 80 1020)"/>
  </g>
  
  <!-- Bottom right decorative elements -->
  <g opacity="0.13">
    <circle cx="1750" cy="900" r="180" fill="#3498db"/>
    <ellipse cx="1850" cy="1000" rx="160" ry="110" fill="#2980b9"/>
    <path d="M 1900 950 Q 1850 900 1800 950 Q 1750 1000 1800 1050 Q 1850 1100 1900 1050 Z" fill="#3498db"/>
  </g>
  
  <!-- Organic shapes - center -->
  <g opacity="0.08">
    <path d="M 400 300 Q 500 250 600 300 T 800 300 Q 750 350 600 350 Q 450 350 400 300 Z" fill="#2ecc71"/>
    <path d="M 1100 700 Q 1200 650 1300 700 T 1500 700 Q 1450 750 1300 750 Q 1150 750 1100 700 Z" fill="#3498db"/>
  </g>
  
  <!-- Small accent circles -->
  <circle cx="400" cy="400" r="40" fill="#2ecc71" opacity="0.08"/>
  <circle cx="1500" cy="500" r="50" fill="#3498db" opacity="0.07"/>
  <circle cx="950" cy="150" r="35" fill="#2ecc71" opacity="0.06"/>
  <circle cx="500" cy="800" r="45" fill="#3498db" opacity="0.07"/>
  
  <!-- Wave patterns at bottom -->
  <path d="M 0 900 Q 240 850 480 900 T 960 900 T 1440 900 T 1920 900 L 1920 1080 L 0 1080 Z" fill="#2ecc71" opacity="0.03"/>
  <path d="M 0 950 Q 320 900 640 950 T 1280 950 T 1920 950 L 1920 1080 L 0 1080 Z" fill="#3498db" opacity="0.02"/>
</svg>
